recanatesi2022:
  type: article
  title: A scale-dependent measure of system dimensionality.
  author:
  - Recanatesi, Stefano
  - Bradde, Serena
  - Balasubramanian, Vijay
  - Steinmetz, Nicholas
  - Shea-Brown, Eric
  date: 2022-08-13
  page-range: '100555'
  serial-number:
    doi: 10.1016/j.patter.2022.100555
    issn: 2666-3899 (Electronic)
    pmcid: PMC9403367
    pmid: '36033586'
  language: en
  abstract: 'A fundamental problem in science is uncovering the effective number of degrees of freedom in a complex system: its dimensionality. A system''s dimensionality depends on its spatiotemporal scale. Here, we introduce a scale-dependent generalization of a classic enumeration of latent variables, the participation ratio. We demonstrate how the scale-dependent participation ratio identifies the appropriate dimension at local, intermediate, and global scales in several systems such as the Lorenz attractor, hidden Markov models, and switching linear dynamical systems. We show analytically how, at different limiting scales, the scale-dependent participation ratio relates to well-established measures of dimensionality. This measure applied in neural population recordings across multiple brain areas and brain states shows fundamental trends in the dimensionality of neural activity-for example, in behaviorally engaged versus spontaneous states. Our novel method unifies widely used measures of dimensionality and applies broadly to multivariate data across several fields of science.'
  parent:
    type: periodical
    title:
      value: Patterns (New York, N.Y.)
      short: Patterns (N Y)
    issue: '8'
    volume: '3'

gao2017:
  type: article
  title: A theory of multineuronal dimensionality, dynamics and measurement
  author:
  - Gao, Peiran
  - Trautmann, Eric
  - Yu, Byron
  - Santhanam, Gopal
  - Ryu, Stephen
  - Shenoy, Krishna
  - Ganguli, Surya
  date: 2017
  url: https://www.biorxiv.org/content/early/2017/11/12/214262
  serial-number:
    doi: 10.1101/214262
  abstract: 'In many experiments, neuroscientists tightly control behavior, record many trials, and obtain trial-averaged firing rates from hundreds of neurons in circuits containing billions of behaviorally relevant neurons. Di-mensionality reduction methods reveal a striking simplicity underlying such multi-neuronal data: they can be reduced to a low-dimensional space, and the resulting neural trajectories in this space yield a remarkably insightful dynamical portrait of circuit computation. This simplicity raises profound and timely conceptual questions. What are its origins and its implications for the complexity of neural dynamics? How would the situation change if we recorded more neurons? When, if at all, can we trust dynamical portraits obtained from measuring an infinitesimal fraction of task relevant neurons? We present a theory that answers these questions, and test it using physiological recordings from reaching monkeys. This theory reveals conceptual insights into how task complexity governs both neural dimensionality and accurate recovery of dynamic portraits, thereby providing quantitative guidelines for future large-scale experimental design.'
  parent:
    type: periodical
    title: bioRxiv
    publisher: Cold Spring Harbor Laboratory

